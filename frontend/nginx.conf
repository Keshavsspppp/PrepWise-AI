server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are content-addressed, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The app uses HashRouter, so routing happens client-side after index.html loads.
    # try_files still covers direct hits on any non-asset path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
