# Render Blueprint — deploys the API and the static frontend on the free plan.
#
# Both services are free. MongoDB is NOT defined here: use your existing MongoDB Atlas
# free cluster and paste its connection string into MONGO_URI when prompted.
#
# Free-plan behaviour worth knowing before you deploy:
#   - The API sleeps after 15 minutes idle; the next request takes ~50s to wake it.
#   - There is no persistent disk. Note *vectors* live in MongoDB and survive restarts,
#     so search, quizzes and viva keep working — but the original PDF files do not, so
#     "Download" on an old note will 404 after a restart.
services:
  - type: web
    name: prepwise-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "false"
      # Paste your MongoDB Atlas connection string (mongodb+srv://...) at deploy time.
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Render generates a strong random value and keeps it stable across deploys.
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Both point at the static site below. Update if you attach a custom domain.
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: prepwise-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: prepwise-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: prepwise-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Baked into the bundle at build time, so changing it needs a rebuild.
      - key: VITE_API_URL
        fromService:
          type: web
          name: prepwise-api
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # The app uses HashRouter, but this keeps deep links working regardless.
      - type: rewrite
        source: /*
        destination: /index.html
